# AutoForge Roles Configuration
# =============================
# Location: ~/.autoforge/auth.yaml (override with AUTOFORGE_AUTH_CONFIG)
#
# Only used when AUTOFORGE_AUTH_MODE=header. AutoForge then trusts the
# identity headers set by an authenticating reverse proxy (Authentik,
# oauth2-proxy for Entra ID / Google / GitHub / Keycloak, Authelia, ...) and
# maps users and groups onto roles defined here.
#
# The file is reloaded automatically when it changes. If it is missing or
# invalid, nobody gets access (fail closed) - check the server log.
#
# Roles (lowest to highest):
#   none       - no access to the project (it is hidden from the project list)
#   viewer     - read-only: browse features, graph, logs, live progress
#   developer  - full project control: agent, features, terminal, dev server,
#                assistant / spec / expand chats, schedules, prompts, reset
#   admin      - everything on every project, plus global settings, the server
#                filesystem browser, and creating / deleting projects
#
# User and group names are matched case-insensitively. When a user matches
# several rules, the highest role wins.

version: 1

# Role for authenticated users who match no rule below: none | viewer | developer
default_role: none

# Global administrators
admins:
  users:
    - alice@example.com
  groups:
    - autoforge-admins          # Authentik group name, or Entra ID group object ID

# Per-project roles. "*" applies to every project.
projects:
  "*":
    viewer:
      groups:
        - engineering

  my-app:
    developer:
      users:
        - bob@example.com
      groups:
        - my-app-devs
    viewer:
      groups:
        - qa
